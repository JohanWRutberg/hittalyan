# Anropar poll-endpointen var 30:e minut. Den hämtar alla fyra bostadsförmedlingar. Vercel Hobby tillåter bara cron en gång per dag,
# så detta workflow ger den täta pollningen gratis (obegränsade Actions-minuter på publika repon).
# Kör på :05 och :35 för att undvika de mest belastade tiderna i GitHub Actions-schemaläggaren
# (hel- och halvtimmar). Sätt secrets APP_URL och CRON_SECRET i GitHub.
name: Poll bostadsförmedlingarna

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        run: |
          # En förmedling per anrop: då får var och en hela funktionens tidsgräns
          # för sig, och en långsam källa kan inte tvinga fram en 504 för de andra.
          # Alla fyra försöks även om någon misslyckas.
          fail=0
          for market in stockholm vast syd uppsala; do
            echo "--- $market"
            if curl --fail --silent --show-error --max-time 120 --location \
                 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                 "${{ secrets.APP_URL }}/api/cron/poll?market=$market"; then
              echo
            else
              echo "::warning::pollningen misslyckades för $market"
              fail=1
            fi
          done
          exit $fail
