# Anropar poll-endpointen varje timme. Vercel Hobby tillåter bara cron en gång per dag,
# så detta workflow ger timvis polling gratis. Sätt secrets APP_URL och CRON_SECRET i GitHub.
name: Poll Bostadsförmedlingen

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/poll"
