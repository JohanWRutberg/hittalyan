# Anropar poll-endpointen var 30:e minut, en kö per anrop. Hur ofta varje kö faktiskt hämtas
# bestäms i koden (pollEveryMinutes i src/lib/markets.ts): en kö som inte står på tur hoppas
# över av endpointen, så loopen nedan behöver inte känna till takten. Vercel Hobby tillåter bara cron en gång per dag,
# så detta workflow ger den täta pollningen gratis (obegränsade Actions-minuter på publika repon).
# Kör på :05 och :35 för att undvika de mest belastade tiderna i GitHub Actions-schemaläggaren
# (hel- och halvtimmar). Sätt secrets APP_URL och CRON_SECRET i GitHub.
name: Poll bostadsförmedlingarna

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # En förmedling per anrop: då får var och en hela funktionens tidsgräns
          # för sig, och en långsam källa kan inte tvinga fram en 504 för de andra.
          # Alla förmedlingar försöks även om någon misslyckas.
          #
          # Jobbet blir rött bara när **kedjan** är trasig: Vercel svarar inte, fel
          # hemlighet, databasen nere – då svarar endpointen något annat än 200.
          # Krånglar en förmedling svarar den 200 med "ok":false. Det felet är
          # bokfört, och appen larmar själv om det en gång, med orsaken (se
          # src/lib/poll-health.ts). Här blir det bara en varning i körningen.
          # Förut blev jobbet rött varje halvtimme så länge en källa krånglade.
          #
          # --fail-with-body: vid fel skrivs svarskroppen ut, alltså vilket fel
          # pollningen faktiskt fick.
          poll_market() {
            curl --fail-with-body --silent --show-error --max-time 120 --location \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/poll?market=$1"
          }

          fail=0
          for market in stockholm vast syd uppsala homeq; do
            echo "--- $market"
            if ! body=$(poll_market "$market"); then
              # Ett andra försök efter en paus: en kall Neon-databas eller en kall
              # serverless-funktion kan fälla första anropet.
              echo "$body"
              echo "  (kedjan svarade inte, försöker igen om 30 s)"
              sleep 30
              if ! body=$(poll_market "$market"); then
                echo "$body"
                echo "::error::pollningen nådde inte fram för $market – kedjan är trasig, inte källan"
                fail=1
                continue
              fi
            fi
            echo "$body"
            if echo "$body" | grep -q '"ok":false'; then
              echo "::warning::$market: källan krånglade (bokfört, larmas av appen)"
            fi
          done
          exit $fail
