# Anropar poll-endpointen var 30:e minut. Vercel Hobby tillåter bara cron en gång per dag,
# så detta workflow ger den täta pollningen gratis (obegränsade Actions-minuter på publika repon).
# Kör på :05 och :35 för att undvika de mest belastade tiderna i GitHub Actions-schemaläggaren
# (hel- och halvtimmar). Sätt secrets APP_URL och CRON_SECRET i GitHub.
name: Poll Bostadsförmedlingen

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/poll"
