# Anropar poll-endpointen var 30:e minut, en kö per anrop. Vercel Hobby tillåter bara cron en gång per dag,
# så detta workflow ger den täta pollningen gratis (obegränsade Actions-minuter på publika repon).
# Kör på :05 och :35 för att undvika de mest belastade tiderna i GitHub Actions-schemaläggaren
# (hel- och halvtimmar). Sätt secrets APP_URL och CRON_SECRET i GitHub.
name: Poll bostadsförmedlingarna

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # En förmedling per anrop: då får var och en hela funktionens tidsgräns
          # för sig, och en långsam källa kan inte tvinga fram en 504 för de andra.
          # Alla förmedlingar försöks även om någon misslyckas.
          #
          # --fail-with-body: vid 500 skrivs svarskroppen ut, alltså vilket fel
          # pollningen faktiskt fick. Utan den stod bara "error: 500" i loggen och
          # orsaken gick bara att läsa i adminportalens körningslogg.
          poll_market() {
            curl --fail-with-body --silent --show-error --max-time 120 --location \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/poll?market=$1"
          }

          fail=0
          for market in stockholm vast syd uppsala homeq; do
            echo "--- $market"
            if poll_market "$market"; then
              echo
            else
              # Ett andra försök efter en paus. Förmedlingarnas servrar är vanliga
              # webbplatser och svarar då och då 5xx, och en kall Neon-databas eller
              # en kall serverless-funktion kan också fälla första anropet. Adaptern
              # försöker redan om internt; det här fångar det som ligger på vår sida.
              echo "  (misslyckades, försöker igen om 30 s)"
              sleep 30
              if poll_market "$market"; then
                echo
              else
                echo "::warning::pollningen misslyckades för $market även vid andra försöket"
                fail=1
              fi
            fi
          done
          exit $fail
